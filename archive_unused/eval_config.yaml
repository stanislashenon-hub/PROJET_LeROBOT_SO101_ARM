env:
  type: gym_manipulator
  name: so101_follower
  fps: 30
  robot:
    type: so101_follower
    port: /dev/ttyACM1
    cameras:
      front:
        type: opencv
        index_or_path: /dev/video2
        width: 640
        height: 480
        fps: 30

policy:
  pretrained_path: LEO2862/act_so101_pick_place

eval:
  n_episodes: 3
  batch_size: 1

output_dir: ./eval_results
